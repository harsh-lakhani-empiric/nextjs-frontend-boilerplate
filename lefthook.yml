pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    - name: format
      glob: "*.{js,jsx,ts,tsx,json,css,md}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: typecheck
      run: pnpm run typecheck
